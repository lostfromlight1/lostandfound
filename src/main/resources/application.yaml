server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: lostandfound-app

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/lostandfound_db}
    username: ${DB_USERNAME:lostandfound_user}
    password: ${DB_PASSWORD:lostandfound123}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

app:
  security:
    api-version: /api/v1

    public-routes:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**

    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
        - ${PUBLIC_FRONTEND_URL:http://localhost:3000}
      allowed-methods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
      allowed-headers: [ Authorization, Content-Type, X-API-KEY ]
      exposed-headers: [ Authorization ]

    api-key:
      header: X-API-KEY
      value: ${API_KEY:your-default-dev-key}

jwt:
  issuer: lostandfound-app
  secret: ${JWT_SECRET:your-super-secret-development-key-32-chars-min}
  expiration:
    access-token: 900000     # 15 minutes in ms
    refresh-token: 604800000 # 7 days in ms


springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId:-N/A}] %logger{36} - %msg%n"

  level:
    root: INFO
    com.lostandfound: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
